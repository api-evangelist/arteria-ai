name: Arteria AI
description: 'Arteria AI is an enterprise AI company for financial services that positions itself as
  the agentic backbone of financial services operations. Its platform automates document-intensive
  workflows across the institutional client lifecycle for tier-one global financial institutions:
  OTC derivatives and ISDA onboarding, prime brokerage, securities services and custody, corporate and
  commercial lending, trade confirmations, securities lending and repo, regulatory reporting, and
  post-transaction loan compliance. The platform spans four layers (data, component, agentic, and
  workflow), combining no-code configuration, automated document generation, intelligent extraction
  with zero-shot models, clause comparison and decisioning, and controlled agentic orchestration.
  Arteria AI is SOC 2 Type II and ISO 27001 certified. It does not publish a public API or developer
  portal; this profile captures the company identity, domain-security posture, and published compliance
  certifications.'
